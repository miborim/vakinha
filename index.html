    <!-- Pré-carrega apenas a colagem do hero que será realmente exibida (LCP) -->
    <link
      rel="preload"
      as="image"
      href="/hero/hero-desktop.webp"
      media="(min-width: 861px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/hero/hero-mobile.webp"
      media="(max-width: 860px)"
      fetchpriority="high"
    />

    <!-- Fontes: carregadas sem bloquear a renderização (display=swap já evita texto invisível) -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="preload"
